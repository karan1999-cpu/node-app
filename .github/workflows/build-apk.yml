name: Build APK

# Every push builds a test APK and keeps it on the run's page under "Artifacts".
# Pushing a tag like v0.1.1 also publishes a GitHub Release with the APK attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # lets the tag build create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Run tests and build the APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Name the APK
        id: apk
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            label="$GITHUB_REF_NAME"
          else
            label="$(git rev-parse --short HEAD)"
          fi
          file="Noddy-${label}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: Noddy-debug-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Attach the APK to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
